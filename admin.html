<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZIET Mumbai Admin Verification</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>body{font:16px system-ui;background:#f2f5fa;margin:0;color:#17283d}header{background:#143d68;color:white;padding:20px}main{max-width:950px;margin:24px auto;padding:0 14px}.card{background:white;border:1px solid #dce4ef;border-radius:12px;padding:18px;margin:14px 0}.status{padding:10px;background:#edf3fb;border-radius:8px;white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border:1px solid #bdc9d9;border-radius:8px}button{cursor:pointer;background:#164d84;color:white}.record{padding:12px 0;border-top:1px solid #ddd}</style></head><body><header><b>KENDRIYA VIDYALAYA SANGATHAN</b><div>ZIET Mumbai · Secure Official Verification</div></header><main><section class="card"><h2>Administrator sign-in</h2><p>Authorized account: <b>taprimaryzietmumbai@gmail.com</b></p><div id="signin"></div><p id="auth" class="status">Configure the Google OAuth Client ID to enable sign-in.</p></section><section id="work" class="card" hidden><div class="row"><input id="q" placeholder="Search participants"><button id="reload">Refresh</button><button id="logout">Sign out</button></div><p id="msg" class="status"></p><div id="records"></div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbw5xq8dvfMlaFE4Go6yIyFaCjRr2WMzyyS0bozW29LB3u9SNujZlfmbZAOCDrxIIwe4/exec';
const CLIENT_ID='17397027972-tbgs73accf5jrfengoih738ppvsbdrf4.apps.googleusercontent.com';const ALLOWED='taprimaryzietmumbai@gmail.com';let idToken='',records=[];
function say(id,t){document.getElementById(id).textContent=t}
function request(p){return new Promise((resolve,reject)=>{const cb='zietcb'+Date.now(),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();reject(Error('Apps Script request timed out'))},15000);window[cb]=v=>{clearTimeout(timer);delete window[cb];s.remove();resolve(v)};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();reject(Error('Apps Script request failed'))};s.src=API+'?'+new URLSearchParams({...p,callback:cb});document.head.appendChild(s)})}
function signedIn(result){idToken=result.credential;try{const p=JSON.parse(atob(idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(p.email.toLowerCase()!==ALLOWED||!p.email_verified)throw Error()}catch(e){idToken='';say('auth','Access denied. Sign in with '+ALLOWED);return}document.getElementById('work').hidden=false;say('auth','Signed in as '+ALLOWED);loadRecords()}
function init(){if(!window.google?.accounts){setTimeout(init,250);return}google.accounts.id.initialize({client_id:CLIENT_ID,callback:signedIn});google.accounts.id.renderButton(document.getElementById('signin'),{theme:'outline',size:'large',text:'signin_with'})}window.addEventListener('load',init);
async function loadRecords(){say('msg','Loading records…');try{const r=await request({action:'adminList',idToken});if(!r.success)throw Error(r.error||'Could not load records');records=r.records||[];render();say('msg',records.length+' records loaded.')}catch(e){say('msg',e.message)}}
function render(){const q=document.getElementById('q').value.toLowerCase(),host=document.getElementById('records');host.replaceChildren();records.filter(r=>[r.name,r.region,r.workshop].join(' ').toLowerCase().includes(q)).forEach(r=>{const d=document.createElement('div');d.className='record';const h=document.createElement('b');h.textContent=r.name||'Unnamed participant';const p=document.createElement('p');p.textContent=[r.region,r.workshop,'Row '+r.row].filter(Boolean).join(' · ');d.append(h,p);host.append(d)})}
document.getElementById('q').oninput=render;document.getElementById('reload').onclick=loadRecords;document.getElementById('logout').onclick=()=>{idToken='';records=[];document.getElementById('work').hidden=true;say('auth','Signed out. Reload to sign in again.')};
</script></body></html>
